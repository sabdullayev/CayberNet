version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ronin_postgres
    restart: always
    environment:
      POSTGRES_USER: ronin_user
      POSTGRES_PASSWORD: ronin_secret_password
      POSTGRES_DB: ronin_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ronin_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: